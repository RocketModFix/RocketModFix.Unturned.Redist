name: "Redist Publish"

on:
  push:
    branches: [ master ]
    paths:
      - 'redist/redist-*/**'
  workflow_dispatch:
    inputs:
      variant:
        description: 'A variant name from .github/variants.json, or "all"'
        required: true
        default: 'all'
        type: string
      deprecate_legacy:
        description: 'Mark Client-Preview and Server-Preview as Legacy on nuget.org (no pack/push)'
        required: false
        default: false
        type: boolean

jobs:
  # Obsolete standalone preview package ids. Needs PackageUnlist on the OIDC key;
  # if nuget.org returns 403, do the same in the nuget.org UI (Manage packages →
  # Deprecation → Legacy, alternate …Client / …Server).
  deprecate-legacy:
    name: "Deprecate legacy Preview packages"
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deprecate_legacy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Deprecate Client-Preview and Server-Preview
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          deprecate() {
            local id="$1"
            local alt="$2"
            local msg="$3"
            local id_lower
            id_lower=$(printf '%s' "$id" | tr '[:upper:]' '[:lower:]')
            echo "Deprecating $id → $alt"
            versions=$(curl -fsSL "https://api.nuget.org/v3-flatcontainer/${id_lower}/index.json" | jq -r '.versions[]')
            if [ -z "$versions" ]; then
              echo "::error::No versions found for $id"
              exit 1
            fi
            args=()
            while IFS= read -r v; do
              args+=(--data-urlencode "versions=${v}")
            done <<< "$versions"
            http_code=$(curl -sS -o /tmp/nuget-deprecate.out -w '%{http_code}' -X PUT \
              "https://www.nuget.org/api/v2/package/${id}/deprecations" \
              -H "X-NuGet-ApiKey: ${NUGET_KEY}" \
              -H "User-Agent: RocketModFix.Unturned.Redist-CI" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "isLegacy=true" \
              --data-urlencode "alternatePackageId=${alt}" \
              --data-urlencode "message=${msg}" \
              "${args[@]}")
            echo "HTTP ${http_code}"
            cat /tmp/nuget-deprecate.out || true
            echo
            case "$http_code" in
              200|204) echo "✅ $id deprecated" ;;
              *)
                echo "::error::Failed to deprecate $id (HTTP ${http_code}). If this is 403, the OIDC key lacks unlist — mark it Legacy in the nuget.org UI instead."
                exit 1
                ;;
            esac
          }
          deprecate \
            "RocketModFix.Unturned.Redist.Client-Preview" \
            "RocketModFix.Unturned.Redist.Client" \
            "Obsolete. Use RocketModFix.Unturned.Redist.Client and enable prerelease for preview builds."
          deprecate \
            "RocketModFix.Unturned.Redist.Server-Preview" \
            "RocketModFix.Unturned.Redist.Server" \
            "Obsolete. Use RocketModFix.Unturned.Redist.Server and enable prerelease for preview builds."

  # Single source of truth: variant definitions live in .github/variants.json.
  load-variants:
    name: "Load Variants"
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.deprecate_legacy != 'true'
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.load.outputs.variants }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load variant matrix
        id: load
        env:
          INPUT_VARIANT: ${{ github.event.inputs.variant }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_VARIANT:-}" ] && [ "$INPUT_VARIANT" != "all" ]; then
            if ! jq -e --arg v "$INPUT_VARIANT" 'any(.[]; .variant == $v)' .github/variants.json >/dev/null; then
              echo "::error::Unknown variant '$INPUT_VARIANT'. Valid variants:"
              jq -r '.[].variant' .github/variants.json
              exit 1
            fi
            variants=$(jq -c --arg v "$INPUT_VARIANT" '[.[] | select(.variant == $v)]' .github/variants.json)
          else
            variants=$(jq -c '.' .github/variants.json)
          fi
          echo "variants=$variants" >> "$GITHUB_OUTPUT"

  build:
    name: "Build ${{ matrix.variant }}"
    runs-on: ubuntu-22.04
    needs: load-variants
    # Trusted Publishing: id-token lets NuGet/login mint a short-lived key via OIDC.
    permissions:
      contents: read
      id-token: write
      packages: write   # best-effort GitHub Packages mirror
    # No job-level continue-on-error: a failed pack/push must surface red.
    # fail-fast:false keeps the other (independent) variants building.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-variants.outputs.variants) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Full history so we can diff the push range for per-variant change detection.
        fetch-depth: 0

    - name: Determine if this variant should run
      id: check
      env:
        EVENT_NAME: ${{ github.event_name }}
        DIR: ${{ matrix.dir }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        should_run=false
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          # load-variants already filtered the matrix to the requested variant(s).
          should_run=true
        else
          # Native git diff (no tj-actions/changed-files). github.event.before is the
          # prior master tip; fall back to HEAD~1.
          before="$BEFORE_SHA"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="HEAD~1"
          fi
          if ! git rev-parse --verify "$before" >/dev/null 2>&1; then
            # No usable baseline (e.g. first push to a branch) -> build to be safe.
            should_run=true
          elif git diff --name-only "$before" "$AFTER_SHA" -- "$DIR/" | grep -q .; then
            should_run=true
          fi
        fi
        echo "Variant ${{ matrix.variant }} should_run=$should_run"
        echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

    - name: Setup NuGet
      if: steps.check.outputs.should_run == 'true'
      uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4

    # Exchange the GitHub OIDC token for a ~1h NuGet key. Run right before push:
    # the key expires in an hour and pack is fast, so this ordering is safe.
    - name: NuGet login (OIDC -> temp API key)
      if: steps.check.outputs.should_run == 'true'
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: NuGet Pack & Push
      if: steps.check.outputs.should_run == 'true'
      uses: ./.github/actions/nuget-pack
      id: nuget-pack
      with:
        nuspec_path: ${{ matrix.nuspec }}
        nuget_key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        nuget_push: true

    # Best-effort mirror to GitHub Packages; nuget.org above is the primary. Its NuGet
    # feed needs auth even to restore, so this is a backup, not the main source.
    - name: Mirror to GitHub Packages
      if: steps.check.outputs.should_run == 'true'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail
        dotnet nuget push *.nupkg \
          --source "https://nuget.pkg.github.com/${OWNER}/index.json" \
          --api-key "$GH_TOKEN" --skip-duplicate
